name: PATCHWORK diagnostics validation
on:
  pull_request:
    paths:
      - 'tools/patchwork/**'
      - 'portal.py'
      - '.github/workflows/patchwork-validation.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax
        run: python -m py_compile portal.py tools/patchwork/scan.py tools/patchwork/diagnostics.py tools/patchwork/test_diagnostics.py tools/patchwork/repair.py tools/patchwork/proposal_engine.py tools/patchwork/test_repair.py tools/patchwork/test_proposal_engine.py tools/patchwork/ai_repair.py tools/patchwork/test_ai_repair.py tools/patchwork/campaign.py tools/patchwork/test_campaign.py tools/patchwork/polyglot.py tools/patchwork/triage.py tools/patchwork/test_polyglot.py tools/patchwork/release_gate.py tools/patchwork/test_release_gate.py tools/patchwork/github_publisher.py tools/patchwork/test_github_publisher.py tools/patchwork/isolated_verify.py tools/patchwork/test_isolated_verify.py tools/patchwork/github_ci_gate.py tools/patchwork/test_github_ci_gate.py tools/patchwork/atomic_publisher.py tools/patchwork/test_atomic_publisher.py tools/patchwork/release_policy.py tools/patchwork/test_release_policy.py tools/patchwork/test_archive_safety.py tools/patchwork/rehearsal.py tools/patchwork/test_rehearsal.py tools/patchwork/real_docker_integration.py tools/patchwork/live_integration.py tools/patchwork/test_live_integration.py tools/patchwork/live_readiness.py tools/patchwork/test_live_readiness.py tools/patchwork/test_policy_occurrences.py
      - name: Test PATCHWORK diagnostics
        run: python -m unittest discover -s tools/patchwork -p 'test_*.py' -v
