name: VELXTRIA V59 validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m compileall -q .
      - name: Business OS unit tests
        run: python -m unittest test_business_os_v59 test_business_agents_v59 test_business_intelligence_v60 test_agent_engine_v61 test_business_collaboration_v62 test_workflow_v63 test_customer_assistant_v64 test_integrations_v65 test_native_integrations_v66 test_hubspot_v67 test_sync_control_v68 test_scheduled_sync_v69 -v
