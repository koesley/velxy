name: VELXTRIA V59 validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velxtria_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: velxtria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velxtria_test -d velxtria_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Real PostgreSQL connectivity test
        env:
          VELXTRIA_TEST_DATABASE_URL: postgresql://velxtria_test:local_ci_only@localhost:5432/velxtria_test
        run: python -m unittest test_postgres_integration -v
      - name: Compile Python
        run: python -m compileall -q .
      - name: Business OS unit tests
        run: python -m unittest test_guest_invites test_verify_database test_persistent_config test_verify_btc_wallet test_direct_btc_worker test_direct_btc_monitor test_direct_btc_billing test_direct_btc_orders test_bitcoin_addresses test_direct_bitcoin test_btcpay_production test_verified_payment_activation test_mission_control test_business_os_v59 test_business_agents_v59 test_business_intelligence_v60 test_agent_engine_v61 test_business_collaboration_v62 test_workflow_v63 test_customer_assistant_v64 test_integrations_v65 test_native_integrations_v66 test_hubspot_v67 test_sync_control_v68 test_scheduled_sync_v69 test_hubspot_oauth_v70 test_oauth_scheduler_v71 test_integration_health_v72 test_sync_retries_v73 test_sync_recovery_v74 test_contact_checkpoints_v75 -v
