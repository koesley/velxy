name: V59 Ascension validation
on:
  push:
    branches: [feature/v59-render-readiness]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: V59 isolated tests
        run: python -m unittest test_ascension_suite_v59 -v
      - name: Validate Render YAML and migration files exist
        run: |
          test -f render.yaml
          test -f migrations/v59_001_postgres.sql
          test -f scripts/check_v59_render.py
