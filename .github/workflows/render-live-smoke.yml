name: Render live smoke verification
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify Render health and protected Ascension routes
        env:
          BASE_URL: https://velxtria-private-preview-tzie.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          base="${BASE_URL%/}"
          echo "Checking Render health endpoint (free-tier cold starts may take time)"
          healthy=0
          for attempt in $(seq 1 12); do
            status=$(curl --silent --show-error --location --max-time 25 --output /tmp/velxtria-health --write-out '%{http_code}' "$base/healthz" || true)
            if [ "$status" = 200 ] && grep -qx 'ok' /tmp/velxtria-health; then
              healthy=1
              break
            fi
            echo "Health check attempt $attempt: HTTP $status"
            sleep 15
          done
          if [ "$healthy" -ne 1 ]; then
            echo "::error::Render health did not return HTTP 200 with expected body"
            exit 1
          fi
          echo "Render health is reachable"
          for path in /ascension /ascension-recovery; do
            code=$(curl --silent --show-error --max-time 25 --output /tmp/velxtria-route --write-out '%{http_code}' "$base$path")
            if [ "$code" != 401 ] && [ "$code" != 403 ]; then
              echo "::error::$path returned HTTP $code without a session; expected 401 or 403"
              exit 1
            fi
            echo "$path denies unauthenticated access (HTTP $code)"
          done
          echo "Checking public first-time customer journey"
          for path in / /login /register /sample-sales.csv; do
            status=$(curl --silent --show-error --location --max-time 30 --output /tmp/velxtria-public --write-out '%{http_code}' "$base$path")
            if [ "$status" != 200 ]; then
              echo "::error::$path returned HTTP $status; expected 200"
              exit 1
            fi
            if [ "$path" = "/" ] && ! grep -q '/sample-sales.csv' /tmp/velxtria-public; then
              echo "::error::Landing page does not advertise the downloadable sample"
              exit 1
            fi
            if [ "$path" = "/login" ] && ! grep -q 'name="email"' /tmp/velxtria-public; then
              echo "::error::Login form is missing"
              exit 1
            fi
            if [ "$path" = "/register" ] && ! grep -q 'name="password"' /tmp/velxtria-public; then
              echo "::error::Registration form is missing"
              exit 1
            fi
            if [ "$path" = "/sample-sales.csv" ] && ! head -n 1 /tmp/velxtria-public | grep -q 'Order ID,Order Date,Customer,Product,Quantity,Unit Price,Status,Region'; then
              echo "::error::Sample sales CSV does not have the expected import schema"
              exit 1
            fi
            echo "$path is serving the expected public customer experience"
          done
          echo "Running anonymous report engine against the published sample"
          curl --fail --silent --show-error --location --max-time 90 \
            "$base/sample-sales.csv" --output /tmp/velxtria-sample.csv
          demo_code=$(curl --silent --show-error --max-time 120 \
            --form "file=@/tmp/velxtria-sample.csv;filename=sample-sales.csv;type=text/csv" \
            --output /tmp/velxtria-demo.html --write-out '%{http_code}' "$base/try")
          if [ "$demo_code" != 200 ]; then
            echo "::error::Anonymous CSV report returned HTTP $demo_code"
            exit 1
          fi
          if ! grep -q 'Accepted 6 rows' /tmp/velxtria-demo.html || ! grep -q 'flagged 3 rows' /tmp/velxtria-demo.html; then
            echo "::error::Demo report did not contain the expected cleaned-row counts"
            exit 1
          fi
          export BASE_URL="$base"
          python - <<'PY'
          import os
          import re
          import urllib.request
          import zipfile
          import io
          from pathlib import Path

          html = Path('/tmp/velxtria-demo.html').read_text(encoding='utf-8')
          match = re.search(r'/try-download\\?token=([A-Za-z0-9_-]+)', html)
          if not match:
              raise SystemExit('Anonymous demo did not provide a ZIP download token')
          url = os.environ['BASE_URL'] + '/try-download?token=' + match.group(1)
          with urllib.request.urlopen(url, timeout=60) as response:
              payload = response.read(5_000_001)
          if len(payload) > 5_000_000:
              raise SystemExit('Demo ZIP exceeded smoke-test size limit')
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              expected = {'cleaned_sales.csv', 'rejected_rows.csv',
                          'monthly_summary.csv', 'product_summary.csv', 'run_summary.txt'}
              if set(archive.namelist()) != expected:
                  raise SystemExit('Demo ZIP contents do not match report contract')
              summary = archive.read('run_summary.txt').decode('utf-8')
              if 'Paid revenue (accepted Paid orders only): $800.00' not in summary:
                  raise SystemExit('Demo ZIP revenue summary did not match expected sample')
          print('Anonymous report generated and downloadable ZIP validated')
          PY
          echo "Smoke verification passed: public onboarding, real anonymous reporting, ZIP download, and access controls. Authenticated payments and deployed commit identity are not verified."
