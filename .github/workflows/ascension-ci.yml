name: Ascension Security and Regression Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ascension-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ascension-tests:
    name: Ascension tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VELXTRIA_LOCAL_STUDIO: '1'
      VELXTRIA_DEPLOYMENT_MODE: local
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile touched modules and regression tests
        run: python -m py_compile ascension_v28.py test_ascension_v28.py foundation_v26.py launchpad_v27.py empire_v19.py
      - name: Verify deployment safety contract
        run: python -m unittest -v test_render_blueprint_contract
      - name: Execute Ascension regression suite
        run: python -m unittest -v test_ascension_v28
