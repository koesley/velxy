name: VELXTRIA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velxtria-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }} application verification
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      VELXTRIA_DEPLOYMENT_MODE: local
      VELXTRIA_REQUIRE_PERSISTENCE: '0'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q .
      - name: Database, storage and lifecycle regressions
        run: |
          python -m unittest -v \
            test_schema_lifecycle \
            test_pg_adapter \
            test_sql_params \
            test_deployment_database_url \
            test_verify_database \
            test_verify_storage \
            test_verify_readiness
      - name: Offline deployment inspection
        run: python deployment_readiness_v43.py
      - name: Boot real HTTP server and verify homepage
        run: python smoke_http.py
