name: VELXTRIA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velxtria-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }} application verification
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      VELXTRIA_DEPLOYMENT_MODE: local
      VELXTRIA_REQUIRE_PERSISTENCE: '0'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q .
      - name: Database, storage and lifecycle regressions
        run: |
          python -m unittest -v \
            test_invoice_integrity \
            test_site_stats \
            test_schema_lifecycle \
            test_pg_adapter \
            test_sql_params \
            test_deployment_database_url \
            test_verify_database \
            test_verify_storage \
            test_verify_readiness
      - name: Offline deployment inspection
        run: python deployment_readiness_v43.py
      - name: Boot real HTTP server and verify homepage
        run: python smoke_http.py
  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velxtria_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: velxtria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velxtria_test -d velxtria_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VELXTRIA_TEST_DATABASE_URL: postgresql://velxtria_test:disposable_ci_password@127.0.0.1:5432/velxtria_test
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Exercise real PostgreSQL transactions
        run: python -m unittest -v test_postgres_integration
