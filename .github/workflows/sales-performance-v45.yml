name: Sales performance V45 checks
on:
  pull_request:
    paths:
      - 'sales_performance_v45.py'
      - 'test_sales_performance_v45.py'
      - 'sales_execution_v44.py'
      - 'growth_strategy_v42.py'
      - 'portal.py'
      - '.github/workflows/sales-performance-v45.yml'
  push:
    branches: [main]
    paths:
      - 'sales_performance_v45.py'
      - 'test_sales_performance_v45.py'
      - 'sales_execution_v44.py'
      - 'growth_strategy_v42.py'
      - 'portal.py'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax
        run: python -m compileall -q portal.py sales_performance_v45.py test_sales_performance_v45.py
      - name: Run sales performance tests
        run: python -m unittest -v test_sales_performance_v45
