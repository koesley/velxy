name: Sovereign Ascension validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ascension-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m compileall -q .
      - name: Sales and Ascension regression tests
        run: python -m unittest test_outreach_deliverability test_sales_pipeline test_sovereign_ascension test_ascension_recovery test_ascension_first_visit test_ascension_followups test_ascension_command_center test_ascension_next_actions test_ascension_executive_briefing -v
