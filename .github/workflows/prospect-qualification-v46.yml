name: Prospect qualification V46
on:
  pull_request:
    paths:
      - 'prospect_qualification_v46.py'
      - 'test_prospect_qualification_v46.py'
      - 'sales_execution_v44.py'
      - 'growth_strategy_v42.py'
      - 'portal.py'
      - '.github/workflows/prospect-qualification-v46.yml'
  push:
    branches: [main]
    paths:
      - 'prospect_qualification_v46.py'
      - 'test_prospect_qualification_v46.py'
      - 'sales_execution_v44.py'
      - 'growth_strategy_v42.py'
      - 'portal.py'
      - '.github/workflows/prospect-qualification-v46.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile changed modules
        run: python -m py_compile prospect_qualification_v46.py sales_execution_v44.py growth_strategy_v42.py portal.py
      - name: Run prospect regression tests
        run: python -m unittest -v test_prospect_qualification_v46
