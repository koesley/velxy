name: VELXTRIA revenue and activation regression guard
on:
  push:
    branches: [main]
    paths:
      - 'revenue_dominion_v60.py'
      - 'founder_economics.py'
      - 'founder_activation.py'
      - 'test_founder_activation.py'
      - 'test_founder_economics.py'
      - 'site_stats.py'
      - 'test_revenue_dominion_v60.py'
      - 'first_value_v61.py'
      - 'portal.py'
      - 'ledger.py'
      - 'revenue_engine.py'
      - 'site_stats.py'
      - 'test_ledger.py'
      - 'test_revenue_engine.py'
      - 'test_signup_path.py'
      - 'test_instant_demo.py'
      - 'test_first_value_v61.py'
      - '.github/workflows/revenue-activation-guard.yml'
  pull_request:
    paths:
      - 'revenue_dominion_v60.py'
      - 'founder_economics.py'
      - 'founder_activation.py'
      - 'test_founder_activation.py'
      - 'test_founder_economics.py'
      - 'site_stats.py'
      - 'test_revenue_dominion_v60.py'
      - 'first_value_v61.py'
      - 'test_first_value_v61.py'
      - '.github/workflows/revenue-activation-guard.yml'
  schedule:
    - cron: '19 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revenue-activation-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-analytics:
    name: Test V60/V61 analytics on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile revenue_dominion_v60.py first_value_v61.py founder_economics.py founder_activation.py
      - name: Run V60/V61 analytics and real customer-path regressions
        env:
          VELXTRIA_DEPLOYMENT_MODE: local
          VELXTRIA_ENABLE_BTCPAY_MAINNET_CHECKOUT: '0'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest -v \
            test_revenue_dominion_v60 test_first_value_v61 test_founder_economics test_founder_activation \
            test_site_stats test_signup_path test_instant_demo \
            test_demo_claim test_ledger test_revenue_engine
