name: Customer journey regression
on:
  push:
    branches: [main]
    paths:
      - 'portal.py'
      - 'subscriptions.py'
      - 'test_signup_path.py'
      - 'test_landing_page.py'
      - 'test_seo.py'
      - 'test_btcpay_mainnet.py'
      - 'test_payment_confirmation.py'
      - 'test_demo_claim.py'
      - 'btcpay_mainnet.py'
      - '.github/workflows/customer-journey.yml'
  pull_request:
    paths:
      - 'portal.py'
      - 'subscriptions.py'
      - 'test_signup_path.py'
      - 'test_landing_page.py'
      - 'test_seo.py'
      - 'test_btcpay_mainnet.py'
      - 'btcpay_mainnet.py'
      - '.github/workflows/customer-journey.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Test public landing, signup, and SEO
        env:
          VELXTRIA_DEPLOYMENT_MODE: local
          VELXTRIA_ENABLE_BTCPAY_MAINNET_CHECKOUT: '0'
        run: python -m unittest -v test_signup_path test_landing_page test_seo test_btcpay_mainnet test_payment_confirmation test_demo_claim
