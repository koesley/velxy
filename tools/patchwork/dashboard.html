<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELXTRIA · PATCHWORK diagnostics</title>
<style>
body{font:16px system-ui;background:#0b1220;color:#e8edf7;max-width:850px;margin:5vh auto;padding:24px}main{background:#151f30;border:1px solid #34445a;border-radius:18px;padding:28px}h1{margin-top:0}input{margin:12px 0}button{background:#4f83ff;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}.item{padding:14px;border-top:1px solid #34445a}small{color:#a8b7cd}code{overflow-wrap:anywhere}
</style><main><small>VELXTRIA / SOFTWARE REPAIR / LOCAL PREVIEW</small><h1>PATCHWORK diagnostics</h1><p>Open a JSON diagnostic report generated by PATCHWORK. Files are processed in this browser only; no upload or repair occurs.</p>
<input id="report" type="file" accept=".json,application/json"><div id="status" role="status">Choose a report to view findings.</div><div id="results"></div></main>
<script>
const file=document.getElementById('report'),status=document.getElementById('status'),results=document.getElementById('results');
file.addEventListener('change',async()=>{
 results.replaceChildren();
 if(!file.files[0])return;
 try{
  if(file.files[0].size>2e6)throw Error('Report too large');
  const report=JSON.parse(await file.files[0].text());
  if(!Array.isArray(report.findings))throw Error('Invalid report format');
  status.textContent=report.findings.length+' finding(s) · '+(report.python_files_scanned??'Unknown')+' Python files scanned';
  for(const finding of report.findings.slice(0,1000)){
   const item=document.createElement('div');item.className='item';
   const title=document.createElement('strong');title.textContent=(finding.severity||'info').toUpperCase()+' · '+(finding.file||'unknown')+(finding.line?':'+finding.line:'');
   const message=document.createElement('p');message.textContent=finding.message||'No message';
   const suggestion=document.createElement('small');suggestion.textContent=finding.suggestion||'Review the affected file manually';
   item.append(title,message,suggestion);results.append(item);
  }
 }catch(error){status.textContent='Unable to read report: '+error.message;}
});
</script></html>
