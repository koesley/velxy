name: Build VELXTRIA Desktop for Windows
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "pyinstaller>=6,<7" "pywebview>=5,<7"
      - run: python build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: VELXTRIA-Desktop-Windows
          path: dist/VELXTRIA-Desktop/
