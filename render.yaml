services:
  - type: web
    name: velxtria-private-preview
    runtime: python
    plan: free
    buildCommand: "python -m pip install -r requirements.txt && python -m compileall -q . && python -m unittest -q test_sql_params test_deployment_database_url test_verify_database test_verify_storage test_verify_readiness && python deployment_readiness_v43.py"
    startCommand: "python -u portal.py"
    healthCheckPath: /health/ready
    envVars:
      # Never accept paid customer data on Render's ephemeral local SQLite.
      # Configure a durable PostgreSQL connection before deploying this change.
      # A missing database intentionally prevents startup rather than silently
      # losing users, sessions, orders, and reports on instance replacement.
      - key: VELXTRIA_REQUIRE_PERSISTENCE
        value: '1'
      - key: VELXTRIA_DATABASE_URL
        sync: false
      # Report ZIPs use private object storage when PostgreSQL is active.
      - key: VELXTRIA_SUPABASE_URL
        sync: false
      - key: VELXTRIA_SUPABASE_SERVICE_KEY
        sync: false
      - key: VELXTRIA_SUPABASE_BUCKET
        value: velxy-reports
      - key: VELXTRIA_ENABLE_BUSINESS_OS_V59
        value: '1'
      - key: VELXTRIA_DEPLOYMENT_MODE
        value: render-preview
      - key: VELXTRIA_PREVIEW_PASSWORD
        sync: false
      # Production BTCPay (mainnet) — values are entered in the Render
      # dashboard and never committed. See BTCPAY_MAINNET_SETUP.md.
      # The checkout flag is dashboard-controlled (sync: false): it was
      # previously declared here as value '0', so every blueprint sync
      # silently reset it to 0 and turned checkout off — including after
      # it had been switched on in the dashboard and verified live with
      # a real invoice. The store, server and webhook are verified, so
      # the dashboard value now rules and deploys must not touch it.
      - key: VELXTRIA_BTCPAY_MAINNET_URL
        sync: false
      - key: VELXTRIA_BTCPAY_MAINNET_STORE_ID
        sync: false
      - key: VELXTRIA_BTCPAY_MAINNET_API_KEY
        sync: false
      - key: VELXTRIA_BTCPAY_MAINNET_WEBHOOK_SECRET
        sync: false
      - key: VELXTRIA_ENABLE_BTCPAY_MAINNET_CHECKOUT
        sync: false
      # Email delivery on Render Free: outbound SMTP ports 25/465/587 are
      # blocked on this tier, so Gmail SMTP can never send from the service
      # (every attempt fails with OSError: [Errno 101] Network is
      # unreachable, no matter how correct the credentials are). Brevo's
      # HTTPS API is the delivery path instead (SendGrid's signup human
      # check blocked both the cloud browser and the owner's phone in Nov
      # 2026, so no SendGrid account exists) — the key is entered in the
      # Render dashboard and never committed. See SMTP_SETUP.md.
      - key: VELXTRIA_BREVO_API_KEY
        sync: false
      - key: VELXTRIA_SENDGRID_API_KEY
        sync: false
